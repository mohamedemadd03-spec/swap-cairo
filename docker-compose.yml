# ==============================================================================
# swap. — Production Docker Compose Deployment for OVHcloud / VPS
# Zero-Friction 1-Command Deployment:
#   docker compose up -d --build
# ==============================================================================

version: '3.8'

services:
  swap-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: swap-streetwear-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      # Persistent local database & uploads state preserved across rebuilds
      - swap_data:/app/.data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  swap_data:
    driver: local
