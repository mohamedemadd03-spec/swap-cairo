<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SWAP // Security & Ops Command Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@700;800;900&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <style>
    :root {
      --bg: #0c0b0e;
      --card: #151418;
      --border: #232228;
      --volt: #caf300;
      --red: #ff3b30;
      --amber: #ff9500;
      --green: #34c759;
      --text: #ffffff;
      --muted: #8e8d92;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Cairo', 'Space Mono', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .mono { font-family: 'Space Mono', monospace; }
    .display { font-family: 'Syne', 'Cairo', sans-serif; }
    
    /* Layout */
    .container { max-width: 900px; margin: 0 auto; width: 100%; padding: 16px; }
    
    /* Lock Screen */
    #lockScreen {
      position: fixed; inset: 0; background: rgba(12, 11, 14, 0.98);
      display: flex; align-items: center; justify-content: center; z-index: 999;
      padding: 20px;
    }
    .pin-card {
      background: var(--card); border: 2px solid var(--volt);
      border-radius: 20px; padding: 32px 24px; width: 100%; max-width: 360px;
      text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.8);
    }
    .pin-input {
      width: 100%; background: #08080a; border: 1px solid #333; color: var(--volt);
      font-family: 'Space Mono', monospace; font-size: 24px; text-align: center;
      letter-spacing: 8px; padding: 12px; border-radius: 12px; margin: 20px 0 16px;
      outline: none;
    }
    .pin-input:focus { border-color: var(--volt); }
    .btn {
      width: 100%; padding: 14px; border-radius: 12px; font-weight: 700;
      font-size: 14px; text-transform: uppercase; cursor: pointer; border: none;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: all 0.15s ease;
    }
    .btn-volt { background: var(--volt); color: #08080a; }
    .btn-volt:hover { filter: brightness(1.1); transform: scale(0.99); }
    .btn-red { background: rgba(255, 59, 48, 0.18); color: var(--red); border: 1px solid var(--red); }
    .btn-red:hover { background: rgba(255, 59, 48, 0.3); }
    .btn-dim { background: #1e1d22; color: #ddd; border: 1px solid #333; }
    .btn-dim:hover { background: #28272d; }
    
    /* Dashboard */
    header {
      background: #111014; border-bottom: 1px solid var(--border);
      padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;
    }
    .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 16px 0; }
    @media(max-width: 600px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } }
    .kpi-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 14px; text-align: center;
    }
    .kpi-val { font-size: 24px; font-weight: 800; color: var(--text); font-family: 'Space Mono'; }
    .kpi-lbl { font-size: 10.5px; color: var(--muted); text-transform: uppercase; margin-top: 4px; }
    
    /* Tabs */
    .tabs { display: flex; gap: 6px; background: #100f13; padding: 4px; border-radius: 14px; border: 1px solid var(--border); margin-bottom: 16px; }
    .tab-btn {
      flex: 1; padding: 10px 8px; background: transparent; border: none;
      color: var(--muted); font-size: 11.5px; font-weight: 700; border-radius: 10px;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .tab-btn.active { background: var(--volt); color: #08080a; }
    
    /* Report & User Cards */
    .list-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 14px; margin-bottom: 12px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .thumb { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; border: 1px solid var(--border); }
    .badge {
      font-size: 9.5px; font-weight: 700; padding: 3px 8px; border-radius: 6px;
      text-transform: uppercase; font-family: 'Space Mono';
    }
    .badge-pending { background: rgba(255, 149, 0, 0.2); color: var(--amber); border: 1px solid var(--amber); }
    .badge-banned { background: rgba(255, 59, 48, 0.2); color: var(--red); border: 1px solid var(--red); }
    .badge-active { background: rgba(52, 199, 89, 0.2); color: var(--green); border: 1px solid var(--green); }
    
    /* Inventory Grid */
    .inv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
    .inv-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
    .inv-card img { width: 100%; aspect-ratio: 1; object-fit: cover; }
    .inv-info { padding: 10px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  </style>
</head>
<body>

  <!-- MASTER PIN LOCK SCREEN -->
  <div id="lockScreen">
    <div class="pin-card">
      <span class="material-symbols-outlined" style="font-size: 40px; color: var(--volt);">shield_person</span>
      <h2 class="display" style="font-size: 18px; margin-top: 10px; color: #fff;">SWAP // OPS PORTAL</h2>
      <p style="font-size: 11px; color: var(--muted); margin-top: 4px;">لوحة تحكم المشرف وإدارة الأمان والحظر</p>
      
      <input type="password" id="pinInput" class="pin-input" placeholder="••••" maxlength="8" autofocus />
      
      <button class="btn btn-volt" onclick="verifyPin()">
        <span class="material-symbols-outlined">key</span>
        <span>دخول المشرف (Unlock)</span>
      </button>
      <p id="pinError" style="color: var(--red); font-size: 11px; margin-top: 10px; display: none;">رمز المرور غير صحيح!</p>
    </div>
  </div>

  <!-- MAIN ADMIN DASHBOARD -->
  <div id="dashboard" style="display: none;">
    <header>
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--volt); box-shadow: 0 0 10px var(--volt);"></span>
        <span class="display" style="font-weight: 900; font-size: 14px; letter-spacing: 1px;">SWAP COMMAND // ADMIN</span>
      </div>
      <div style="display: flex; gap: 8px;">
        <button class="btn btn-dim" style="width: auto; padding: 6px 12px; font-size: 11px;" onclick="loadData()">
          <span class="material-symbols-outlined" style="font-size: 15px;">refresh</span>
          <span>تحديث</span>
        </button>
        <button class="btn btn-dim" style="width: auto; padding: 6px 12px; font-size: 11px; color: var(--red);" onclick="lockApp()">
          <span class="material-symbols-outlined" style="font-size: 15px;">lock</span>
          <span>قفل</span>
        </button>
      </div>
    </header>

    <div class="container">
      <!-- KPI BENTO BAR -->
      <div class="kpi-grid">
        <div class="kpi-card">
          <div class="kpi-val" id="kpiReports" style="color: var(--amber);">0</div>
          <div class="kpi-lbl">بلاغات معلقة</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-val" id="kpiBanned" style="color: var(--red);">0</div>
          <div class="kpi-lbl">حسابات محظورة</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-val" id="kpiGarments" style="color: var(--volt);">0</div>
          <div class="kpi-lbl">قطع بالسوق</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-val" id="kpiUsers" style="color: #fff;">0</div>
          <div class="kpi-lbl">إجمالي المستخدمين</div>
        </div>
      </div>

      <!-- TABS -->
      <div class="tabs">
        <button class="tab-btn active" id="tabReportsBtn" onclick="switchTab('reports')">
          <span class="material-symbols-outlined" style="font-size: 16px;">report</span>
          <span>البلاغات والشكاوى (<span id="tabReportsCount">0</span>)</span>
        </button>
        <button class="tab-btn" id="tabUsersBtn" onclick="switchTab('users')">
          <span class="material-symbols-outlined" style="font-size: 16px;">group</span>
          <span>المستخدمين والحظر</span>
        </button>
        <button class="tab-btn" id="tabInventoryBtn" onclick="switchTab('inventory')">
          <span class="material-symbols-outlined" style="font-size: 16px;">styler</span>
          <span>فحص المعروضات</span>
        </button>
      </div>

      <!-- TAB 1: REPORTS -->
      <div id="tabReportsView">
        <div id="reportsList">
          <p style="text-align: center; color: var(--muted); font-size: 12px; padding: 30px;">جارٍ تحميل البلاغات...</p>
        </div>
      </div>

      <!-- TAB 2: USERS & BANNING -->
      <div id="tabUsersView" style="display: none;">
        <div style="display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap;">
          <input type="text" id="userSearch" placeholder="ابحث باسم المستخدم @handle أو رقم الهاتف 010... أو الاسم..." oninput="filterUsers()" 
            style="flex: 1; min-width: 240px; background: var(--card); border: 1px solid var(--border); color: #fff; padding: 12px 14px; border-radius: 12px; outline: none; font-size: 13px;" />
          <button class="btn btn-red" onclick="banCustomInput()" style="width: auto; padding: 0 16px; white-space: nowrap; font-size: 12px; display: inline-flex; align-items: center; gap: 6px;">
            <span class="material-symbols-outlined" style="font-size: 16px;">block</span>
            <span>حظر يدوي (رقم هاتف / هاندل)</span>
          </button>
        </div>
        <div id="usersList">
          <p style="text-align: center; color: var(--muted); font-size: 12px; padding: 30px;">جارٍ تحميل المستخدمين...</p>
        </div>
      </div>

      <!-- TAB 3: LIVE INVENTORY INSPECTOR -->
      <div id="tabInventoryView" style="display: none;">
        <div class="inv-grid" id="inventoryGrid">
          <p style="text-align: center; color: var(--muted); font-size: 12px; padding: 30px; grid-column: 1/-1;">جارٍ فحص المعروضات...</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    let activePin = sessionStorage.getItem('swap_admin_pin') || '';
    let globalData = null;

    if (activePin) {
      document.getElementById('lockScreen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadData();
    }

    async function verifyPin() {
      const pin = document.getElementById('pinInput').value.trim();
      const err = document.getElementById('pinError');
      err.style.display = 'none';

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin }),
        });
        const data = await res.json();
        if (data.success) {
          activePin = pin;
          sessionStorage.setItem('swap_admin_pin', pin);
          document.getElementById('lockScreen').style.display = 'none';
          document.getElementById('dashboard').style.display = 'block';
          loadData();
        } else {
          err.style.display = 'block';
        }
      } catch (e) {
        err.style.display = 'block';
      }
    }

    function lockApp() {
      sessionStorage.removeItem('swap_admin_pin');
      activePin = '';
      document.getElementById('dashboard').style.display = 'none';
      document.getElementById('lockScreen').style.display = 'flex';
      document.getElementById('pinInput').value = '';
    }

    async function loadData() {
      try {
        const res = await fetch('/api/admin/overview', {
          headers: { 'x-admin-pin': activePin },
        });
        if (res.status === 401 || res.status === 403) {
          lockApp();
          return;
        }
        globalData = await res.json();
        renderDashboard();
      } catch (err) {
        console.error('Failed to load admin data:', err);
      }
    }

    function renderDashboard() {
      if (!globalData) return;
      const { stats, reports, users, garments, bannedHandles } = globalData;

      document.getElementById('kpiReports').textContent = stats.pendingReportsCount;
      document.getElementById('tabReportsCount').textContent = stats.pendingReportsCount;
      document.getElementById('kpiBanned').textContent = stats.bannedUsersCount;
      document.getElementById('kpiGarments').textContent = stats.totalGarments;
      document.getElementById('kpiUsers').textContent = stats.totalUsers;

      // Render Reports
      const repContainer = document.getElementById('reportsList');
      if (reports.length === 0) {
        repContainer.innerHTML = `<div style="text-align: center; padding: 40px; background: var(--card); border-radius: 16px; border: 1px solid var(--border);">
          <span class="material-symbols-outlined" style="font-size: 36px; color: var(--volt);">verified</span>
          <p style="font-weight: 700; margin-top: 8px;">لا توجد بلاغات معلقة</p>
          <p style="font-size: 11px; color: var(--muted); margin-top: 4px;">المجتمع نظيف ولا توجد شكاوى مسجلة حالياً.</p>
        </div>`;
      } else {
        repContainer.innerHTML = reports.map(r => {
          const isPending = r.status === 'pending';
          const isDeleted = r.status === 'resolved_deleted';
          const owner = (globalData.users || []).find(u => u.handle.toLowerCase() === r.garmentOwnerHandle.toLowerCase());
          const ownerPhone = owner?.phoneNumber || '';
          const cleanOwnerDigits = ownerPhone.replace(/\D/g, '');
          const waOwnerNumber = cleanOwnerDigits.startsWith('01') ? ('2' + cleanOwnerDigits) : cleanOwnerDigits;

          return `
            <div class="list-card" style="${isPending ? 'border-color: rgba(202,243,0,0.3);' : 'opacity: 0.65;'}">
              <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;">
                <div style="display: flex; gap: 12px; align-items: center; min-width: 0;">
                  <img src="${r.garmentImageUrl || 'https://via.placeholder.com/60'}" class="thumb" />
                  <div style="min-width: 0;">
                    <div style="font-weight: 800; font-size: 13px; color: #fff;">${r.garmentTitle}</div>
                    <div class="mono" style="font-size: 11px; color: var(--volt);">صاحب القطعة: ${r.garmentOwnerHandle}</div>
                    ${ownerPhone ? `
                      <div style="display: flex; align-items: center; gap: 6px; margin-top: 3px; font-size: 11px;">
                        <span style="color: #fff; font-family: monospace; font-weight: bold;">📞 ${ownerPhone}</span>
                      </div>
                    ` : ''}
                    <div style="font-size: 10px; color: var(--muted); margin-top: 2px;">أُبلغ بواسطة: ${r.reportedBy} • ${new Date(r.reportedAt).toLocaleDateString()}</div>
                  </div>
                </div>
                <span class="badge ${isPending ? 'badge-pending' : isDeleted ? 'badge-banned' : 'badge-active'}">
                  ${isPending ? 'قيد المراجعة' : isDeleted ? 'تم الحذف' : 'تم التجاهل'}
                </span>
              </div>

              <div style="background: #0d0c0f; padding: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.05); font-size: 11.5px;">
                <strong style="color: var(--red);">السبب:</strong> ${r.reason}
              </div>

              ${isPending ? `
                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;">
                  <button class="btn btn-dim" onclick="resolveReport('${r.id}', 'dismiss', '${r.garmentId}')">
                    <span class="material-symbols-outlined" style="font-size: 14px;">check</span>
                    <span>تجاهل</span>
                  </button>
                  <button class="btn btn-dim" style="color: var(--amber);" onclick="resolveReport('${r.id}', 'delete', '${r.garmentId}')">
                    <span class="material-symbols-outlined" style="font-size: 14px;">delete</span>
                    <span>حذف القطعة</span>
                  </button>
                  <button class="btn btn-red" onclick="banUserFromReport('${r.garmentOwnerHandle}', '${ownerPhone}')">
                    <span class="material-symbols-outlined" style="font-size: 14px;">block</span>
                    <span>حظر صاحبها</span>
                  </button>
                </div>
              ` : ''}
            </div>
          `;
        }).join('');
      }

      renderUsers();
      renderInventory();
    }

    function renderUsers() {
      if (!globalData) return;
      const rawSearch = (document.getElementById('userSearch')?.value || '').toLowerCase().trim();
      const searchDigits = rawSearch.replace(/\D/g, '');
      const bannedSet = new Set((globalData.bannedHandles || []).map(h => String(h).toLowerCase()));

      const filtered = (globalData.users || []).filter(u => {
        if (!rawSearch) return true;
        const hMatch = (u.handle || '').toLowerCase().includes(rawSearch);
        const nameMatch = (u.displayName || '').toLowerCase().includes(rawSearch);
        const emailMatch = (u.email || '').toLowerCase().includes(rawSearch);
        const phone = (u.phoneNumber || '');
        const phoneMatch = phone.toLowerCase().includes(rawSearch);
        const digitMatch = searchDigits.length >= 3 && phone.replace(/\D/g, '').includes(searchDigits);
        return hMatch || nameMatch || emailMatch || phoneMatch || digitMatch;
      });

      const uContainer = document.getElementById('usersList');
      if (filtered.length === 0) {
        uContainer.innerHTML = '<p style="text-align: center; color: var(--muted); font-size: 12px; padding: 30px; background: var(--card); border-radius: 14px; border: 1px solid var(--border);">لا يوجد مستخدمين مطابقين للبحث</p>';
        return;
      }

      uContainer.innerHTML = filtered.map(u => {
        const phoneDigits = (u.phoneNumber || '').replace(/\D/g, '');
        const isBanned = u.isBanned || 
          bannedSet.has(u.handle.toLowerCase()) || 
          (u.phoneNumber && bannedSet.has(u.phoneNumber.toLowerCase())) ||
          (phoneDigits && bannedSet.has(phoneDigits));

        const waNumber = phoneDigits.startsWith('01') ? ('2' + phoneDigits) : (phoneDigits.startsWith('20') ? phoneDigits : phoneDigits);

        return `
          <div class="list-card" style="border-color: ${isBanned ? 'rgba(255, 59, 48, 0.4)' : 'var(--border)'}; background: ${isBanned ? 'rgba(255, 59, 48, 0.04)' : 'var(--card)'};">
            <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap;">
              <div style="display: flex; align-items: center; gap: 12px; min-width: 0;">
                <img src="${u.photoURL || 'https://api.dicebear.com/7.x/bottts/svg?seed=' + u.handle}" class="thumb" style="border-radius: 50%; width: 48px; height: 48px;" />
                <div style="min-width: 0;">
                  <div style="font-weight: 800; font-size: 14px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap;">
                    <span>${u.displayName || u.handle}</span>
                    <span class="mono" style="font-size: 12px; color: var(--volt); background: rgba(202,243,0,0.1); padding: 1px 6px; border-radius: 6px;">${u.handle}</span>
                  </div>
                  
                  <!-- Phone Details & Clean Badge (Plain & Simple) -->
                  <div style="display: flex; align-items: center; gap: 6px; margin-top: 6px; flex-wrap: wrap;">
                    ${u.phoneNumber ? `
                      <span class="mono" style="font-size: 12px; font-weight: 700; color: #fff; background: #1c1b20; border: 1px solid rgba(202,243,0,0.3); padding: 3px 8px; border-radius: 6px; display: inline-flex; align-items: center; gap: 4px;">
                        <span style="color: var(--volt);">📞</span>
                        <span>${u.phoneNumber}</span>
                      </span>
                    ` : `
                      <span style="font-size: 11px; color: var(--muted);">لا يوجد رقم مسجل</span>
                    `}
                    <span style="font-size: 11px; color: var(--muted);">• رصيد: <strong style="color: #fff;">${u.trustPoints || 450}</strong> نقطة</span>
                  </div>

                  ${isBanned ? `
                    <div style="color: var(--red); font-size: 11px; font-weight: bold; margin-top: 6px; display: flex; align-items: center; gap: 4px;">
                      <span>⛔ حساب محظور: ${u.banReason || 'مخالفة معايير سواب'}</span>
                    </div>
                  ` : ''}
                </div>
              </div>

              <div style="display: flex; gap: 6px;">
                ${isBanned ? `
                  <button class="btn btn-dim" style="width: auto; padding: 8px 14px; font-size: 11px; color: var(--green); border-color: rgba(52,199,89,0.3);" onclick="unbanUser('${u.handle}', '${u.phoneNumber || ''}')">
                    <span class="material-symbols-outlined" style="font-size: 15px;">lock_open</span>
                    <span>فك الحظر</span>
                  </button>
                ` : `
                  <button class="btn btn-red" style="width: auto; padding: 8px 14px; font-size: 11px;" onclick="promptBanUser('${u.handle}', '${u.phoneNumber || ''}')">
                    <span class="material-symbols-outlined" style="font-size: 15px;">block</span>
                    <span>حظر فوري</span>
                  </button>
                `}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderInventory() {
      if (!globalData) return;
      const grid = document.getElementById('inventoryGrid');
      const garments = globalData.garments || [];

      if (garments.length === 0) {
        grid.innerHTML = '<p style="text-align: center; color: var(--muted); font-size: 12px; grid-column: 1/-1;">لا توجد قطع معروضة</p>';
        return;
      }

      grid.innerHTML = garments.map(g => `
        <div class="inv-card">
          <img src="${g.imageUrl}" />
          <div class="inv-info">
            <span class="mono" style="font-size: 10px; color: var(--volt);">${g.brand || 'Vintage'}</span>
            <span style="font-weight: 700; font-size: 12px; color: #fff; line-height: 1.2;">${g.title}</span>
            <span style="font-size: 10px; color: var(--muted);">${g.owner?.handle || '@anonymous'} • ${g.estValue || 500} EGP</span>
            <button class="btn btn-red" style="padding: 6px; font-size: 10px; margin-top: 4px;" onclick="deleteGarmentDirect('${g.id}')">
              حذف القطعة 🗑️
            </button>
          </div>
        </div>
      `).join('');
    }

    function switchTab(tab) {
      document.getElementById('tabReportsBtn').classList.toggle('active', tab === 'reports');
      document.getElementById('tabUsersBtn').classList.toggle('active', tab === 'users');
      document.getElementById('tabInventoryBtn').classList.toggle('active', tab === 'inventory');

      document.getElementById('tabReportsView').style.display = tab === 'reports' ? 'block' : 'none';
      document.getElementById('tabUsersView').style.display = tab === 'users' ? 'block' : 'none';
      document.getElementById('tabInventoryView').style.display = tab === 'inventory' ? 'block' : 'none';
    }

    function filterUsers() {
      renderUsers();
    }

    async function resolveReport(reportId, action, garmentId) {
      if (!confirm(action === 'delete' ? 'هل تريد حذف القطعة نهائياً من السيستم؟' : 'هل تريد تجاهل البلاغ واستعادة القطعة؟')) return;
      try {
        await fetch(`/api/reports/${reportId}/resolve`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-admin-pin': activePin },
          body: JSON.stringify({ action }),
        });
        loadData();
      } catch (e) {
        alert('حدث خطأ');
      }
    }

    function copyText(txt) {
      if (!txt) return;
      navigator.clipboard.writeText(txt);
      alert('تم نسخ رقم الهاتف: ' + txt);
    }

    async function promptBanUser(handle, phoneNumber = '') {
      const display = phoneNumber ? `${handle} (${phoneNumber})` : handle;
      const reason = prompt(`اكتب سبب حظر ${display}:`, 'مخالفة معايير سواب / إعلان غير حقيقي');
      if (!reason) return;
      banUser(handle, reason, phoneNumber);
    }

    async function banUserFromReport(handle, phoneNumber = '') {
      const display = phoneNumber ? `${handle} (${phoneNumber})` : handle;
      const reason = prompt(`هل تريد حظر صاحب القطعة ${display} ومسح كل معروضاته من التطبيق؟`, 'إعلان ساخر / محتوى مضلل');
      if (!reason) return;
      banUser(handle, reason, phoneNumber);
    }

    async function banCustomInput() {
      const input = prompt('أدخل رقم هاتف المستخدم (مثال: 01012345678) أو هاندل حسابه:');
      if (!input || !input.trim()) return;
      const reason = prompt(`سبب حظر ${input.trim()}:`, 'حظر إداري مباشر');
      if (!reason) return;
      banUser(input.trim(), reason, input.trim());
    }

    async function banUser(handle, reason, phoneNumber = '') {
      try {
        const res = await fetch('/api/admin/ban-user', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-admin-pin': activePin },
          body: JSON.stringify({ handle, phoneNumber, reason }),
        });
        const d = await res.json();
        alert(d.message || 'تم حظر المستخدم');
        loadData();
      } catch (e) {
        alert('فشل الحظر');
      }
    }

    async function unbanUser(handle, phoneNumber = '') {
      const display = phoneNumber ? `${handle} (${phoneNumber})` : handle;
      if (!confirm(`هل تريد فك الحظر عن ${display}؟`)) return;
      try {
        const res = await fetch('/api/admin/unban-user', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-admin-pin': activePin },
          body: JSON.stringify({ handle, phoneNumber }),
        });
        const d = await res.json();
        alert(d.message || 'تم فك الحظر');
        loadData();
      } catch (e) {
        alert('فشل العملية');
      }
    }

    async function deleteGarmentDirect(garmentId) {
      if (!confirm('حذف هذه القطعة نهائياً من السوق؟')) return;
      try {
        await fetch('/api/admin/delete-garment', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-admin-pin': activePin },
          body: JSON.stringify({ garmentId }),
        });
        loadData();
      } catch (e) {
        alert('فشل الحذف');
      }
    }
  </script>
</body>
